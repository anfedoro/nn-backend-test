[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nn-backend-test"
version = "0.1.0"
description = "Unified NN backend benchmark for MLX and Torch"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.0.0",
    "mlx>=0.30.0; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "mlx[cuda]>=0.30.0; sys_platform == 'linux' and (platform_machine == 'x86_64' or platform_machine == 'amd64')",
    "torch>=2.10.0; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[project.scripts]
nn-backend-test = "main:cli"
nnbt = "main:cli"

[tool.setuptools]
py-modules = ["main"]
packages = ["backends"]
