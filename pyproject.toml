[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nn-backend-test"
version = "0.1.2"
description = "MLX benchmark utility for matrix throughput checks"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.0.0",
    "mlx>=0.31.1; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "mlx>=0.31.1; sys_platform == 'linux'",
    "mlx-cuda-13>=0.31.1; sys_platform == 'linux'",
]

[project.scripts]
nn-backend-test = "bootstrap:cli"
nnbt = "bootstrap:cli"

[tool.setuptools]
py-modules = ["bootstrap", "main"]
packages = ["backends"]
